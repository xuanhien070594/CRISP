services:
  crisp_dev:
    init: true
    image: xuanhien070594/base_dev:latest
    container_name: crisp_dev
    platform: linux/amd64
    stop_signal: SIGINT
    command: ["bash", "-c", "sudo service ssh start && sleep infinity"]
    privileged: true
    network_mode: bridge
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/git:/home/roboticist/git
    environment:
      - DISPLAY=host.docker.internal:0
    ports:
      - "127.0.0.1:2222:22"
    cap_add:
      - SYS_NICE
      - SYS_PTRACE
